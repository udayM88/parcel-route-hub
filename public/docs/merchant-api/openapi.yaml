openapi: 3.1.0
info:
  title: ViaSetu Merchant API
  version: 1.0.0-beta
  description: Server-side API for rates, shipments, tracking, labels, cancellation and wallet balance.
servers:
  - url: https://tksfdvnogzsweteetjjw.supabase.co/functions/v1
security:
  - merchantKey: []
paths:
  /merchant-api:
    post:
      operationId: merchantAction
      summary: Perform a merchant shipping action
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 8, maxLength: 100 }
          description: Required for create_shipment. Reuse it only when retrying the same store order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RatesRequest'
                - $ref: '#/components/schemas/CreateShipmentRequest'
                - $ref: '#/components/schemas/TrackRequest'
                - $ref: '#/components/schemas/LabelRequest'
                - $ref: '#/components/schemas/CancelRequest'
                - $ref: '#/components/schemas/WalletRequest'
              discriminator:
                propertyName: action
      responses:
        '200':
          description: Successful action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '201': { description: Shipment created }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    merchantKey:
      type: http
      scheme: bearer
      bearerFormat: ViaSetu merchant key
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Box:
      type: object
      required: [weight_kg]
      properties:
        weight_kg: { type: number, exclusiveMinimum: 0, maximum: 100 }
        length_cm: { type: number, exclusiveMinimum: 0, maximum: 300 }
        width_cm: { type: number, exclusiveMinimum: 0, maximum: 300 }
        height_cm: { type: number, exclusiveMinimum: 0, maximum: 300 }
    Address:
      type: object
      required: [name, phone, address, city, state, pincode]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, pattern: '^\d{10}$' }
        address: { type: string, maxLength: 300 }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: '^\d{6}$' }
    RatesRequest:
      type: object
      required: [action, pickup_pincode, delivery_pincode, boxes]
      properties:
        action: { const: rates }
        pickup_pincode: { type: string, pattern: '^\d{6}$' }
        delivery_pincode: { type: string, pattern: '^\d{6}$' }
        boxes: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/Box' } }
    CreateShipmentRequest:
      type: object
      required: [action, pickup, delivery, boxes]
      properties:
        action: { const: create_shipment }
        pickup: { $ref: '#/components/schemas/Address' }
        delivery: { $ref: '#/components/schemas/Address' }
        boxes: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/Box' } }
        partner_code: { type: string }
        service_code: { type: string }
        goods_type: { type: string, maxLength: 60 }
        declared_value: { type: number, exclusiveMinimum: 0 }
    TrackRequest:
      type: object
      required: [action]
      properties:
        action: { const: track }
        booking_id: { type: string, format: uuid }
        awb: { type: string }
    LabelRequest:
      type: object
      required: [action, booking_id]
      properties:
        action: { const: label }
        booking_id: { type: string, format: uuid }
        box_index: { type: integer, minimum: 1 }
    CancelRequest:
      type: object
      required: [action, booking_id]
      properties:
        action: { const: cancel }
        booking_id: { type: string, format: uuid }
        reason: { type: string, maxLength: 200 }
    WalletRequest:
      type: object
      required: [action]
      properties:
        action: { const: wallet }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { const: true }
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: true
